name: Build Athena LEDE
on:
  workflow_dispatch:
    inputs:
      compile:
        description: 'Compile firmware after configuration checks'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check free space
        run: df -h
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl subversion time xz-utils
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Verify Athena device definition
        run: |
          test -f target/linux/qualcommax/ipq60xx/image/Makefile || { echo 'Missing qualcommax/ipq60xx target'; exit 1; }
          grep -R -E 'jdcloud_re-cs-02|jdcloud_re-cs-02|jdcloud,re-cs-02' target/linux/qualcommax || { echo 'Athena definition missing'; exit 1; }
      - name: Generate config
        run: |
          cp configs/athena-base.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y$' .config
          grep -Eq '^CONFIG_TARGET_(DEVICE_)?qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y$' .config
          cp .config athena-resolved.config
      - uses: actions/upload-artifact@v4
        with:
          name: athena-resolved-config
          path: athena-resolved.config
      - name: Download sources
        if: ${{ inputs.compile }}
        run: make download -j4
      - name: Build firmware
        if: ${{ inputs.compile }}
        run: make -j$(nproc) || make -j1 V=s
      - name: Upload firmware
        if: ${{ inputs.compile }}
        uses: actions/upload-artifact@v4
        with:
          name: athena-firmware-unverified
          path: bin/targets/qualcommax/ipq60xx/*
          if-no-files-found: error
